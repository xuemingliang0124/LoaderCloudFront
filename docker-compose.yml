services:
  frontend:
    # image 字段决定构建后镜像的完整名称，docker compose build 自动打 tag，
    # docker compose push 可直接推送到阿里云仓库，无需手动 docker tag
    image: ${REGISTRY}/${FRONTEND_IMAGE}:${FRONTEND_TAG}
    build: .
    container_name: loader-cloud-frontend
    ports:
      - "80:80"
    environment:
      # 后端地址从 .env 读取，也可被环境变量覆盖（优先级：shell env > .env > 默认值）
      - BACKEND_HOST=${BACKEND_HOST:-192.168.1.100}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
    restart: unless-stopped
